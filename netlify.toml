[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/loja/:slug/produto/:productId"
  to = "/.netlify/functions/product-preview?slug=:slug&productId=:productId"
  status = 200
  force = true

[[redirects]]
  from = "/loja/:slug/manifest.webmanifest"
  to = "/.netlify/functions/store-manifest?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/loja/:slug"
  to = "/.netlify/functions/store-preview?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
